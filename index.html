<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Product Gallery</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- Theme Toggle Button -->
    <button id="themeToggle">🌙 Dark Mode</button>

    <header>
      <h1>Our Products</h1>
      <p>Choose your favorite product</p>
    </header>

    <!-- Product Gallery -->
    <main class="product-gallery">
      <!-- Product Card 1 -->
      <div class="product-card">
        <img src="pics/laptop.jpg" alt="a Laptop" width="400" height="300" />

        <div class="product-info">
          <h2>Laptop</h2>
          <p>Powerful laptop for work and study.</p>
          <h3>$800</h3>
          <button>Buy Now</button>
        </div>
      </div>

      <!-- Product Card 2 -->
      <div class="product-card">
        <img src="pics/headphone.jpg" alt="an headphones" width="400" height="300"/>

        <div class="product-info">
          <h2>Headphones</h2>
          <p>Enjoy high-quality sound anywhere.</p>
          <h3>$120</h3>
          <button>Buy Now</button>
        </div>
      </div>

      <!-- Product Card 3 -->
      <div class="product-card">
        <img src="pics/smartwatch.jpg" alt="a smart Watch" width="400" height="300" />

        <div class="product-info">
          <h2>Smart Watch</h2>
          <p>Track your activities and stay connected.</p>
          <h3>$150</h3>
          <button>Buy Now</button>
        </div>
      </div>
    </main>

    <script src="script.js"></script>
  </body>
</html>
